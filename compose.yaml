name: brin-edge-workspace

services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./deploy/jetson.env
    environment:
      JETSON_HOST: host.docker.internal
      JETSON_PRIVATE_KEY: /run/secrets/jetson_key
      JETSON_KNOWN_HOSTS: /run/secrets/jetson_known_hosts
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - jetson_key
      - jetson_known_hosts
    volumes:
      - api_camera_cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 160
    mem_limit: 768m
    cpus: 1.5
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 120
    mem_limit: 512m
    cpus: 0.75
    logging: *bounded-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 128m
    cpus: 0.25
    logging: *bounded-logging

secrets:
  jetson_key:
    file: ${JETSON_SSH_KEY_PATH}
  jetson_known_hosts:
    file: ${JETSON_KNOWN_HOSTS_PATH}

volumes:
  api_camera_cache:
  caddy_data:
  caddy_config:
