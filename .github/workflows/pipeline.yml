name: BRIN CI/CD

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this main-branch commit to the Jetson
        required: true
        type: boolean
        default: false

concurrency:
  group: brin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  api-quality:
    name: API quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JETSON_HOST: 127.0.0.1
      JETSON_PORT: "22"
      JETSON_USER: jetson
      JETSON_PRIVATE_KEY: /tmp/ci-jetson-key
      JETSON_KNOWN_HOSTS: /tmp/ci-known-hosts
      JETSON_WORKSPACE: /home/jetson/BRIN-RI-NDIP
      FIREBASE_WEB_API_KEY: ci-placeholder
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_ADMIN_EMAIL: ci@example.invalid
      AUTH_USERNAME: admin
      AUTH_COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies and audit tools
        run: python -m pip install -r requirements.txt pytest bandit pip-audit
      - name: Unit and security tests
        run: python -m pytest -q
      - name: Static security scan
        run: python -m bandit -q -r app
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt

  compose-validation:
    name: Validate Compose deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create non-secret validation environment
        run: cp deploy/jetson.env.example deploy/jetson.env
      - name: Validate base and production Compose files
        run: >-
          IMAGE_TAG=ci-validation
          docker compose
          --env-file deploy/jetson.env
          -f compose.yaml
          -f compose.production.yaml
          config --quiet

  publish-images:
    name: Publish ${{ matrix.service }} ARM64 image
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [web-quality, api-quality, compose-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./apps/api
            image: ghcr.io/skirnola/ssh-brin-web-api
          - service: web
            context: ./apps/web
            image: ghcr.io/skirnola/ssh-brin-web-web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64
          provenance: mode=max
          sbom: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-jetson:
    name: Deploy to Jetson
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && vars.ENABLE_JETSON_DEPLOY == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    needs: publish-images
    runs-on: [self-hosted, linux, ARM64, brin-jetson]
    timeout-minutes: 20
    environment: jetson-production
    concurrency:
      group: jetson-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable images with health check and rollback
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BRIN_APP_DIR: /home/jetson/brin-edge-web
          BRIN_ENV_FILE: /home/jetson/brin-edge-web/deploy/jetson.env
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash deploy/scripts/deploy.sh
